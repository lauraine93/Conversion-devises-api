spring.application.name=Conversion-de-Devises

# Server port
server.port=8085

# ExchangeRate-API configuration
# IMPORTANT : ne jamais commiter de vraie cle API. Definir la variable
# d'environnement EXCHANGE_API_KEY avant de lancer l'application, par exemple :
#   export EXCHANGE_API_KEY=votre_cle_ici        (Linux/Mac)
#   setx EXCHANGE_API_KEY "votre_cle_ici"        (Windows)
# Cle gratuite disponible sur https://www.exchangerate-api.com/
exchange.api.url=https://v6.exchangerate-api.com/v6
exchange.api.key=${EXCHANGE_API_KEY:CHANGE_ME}

# Caffeine Cache configuration (5 minutes TTL)
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=5m

# WebClient timeout configuration
webclient.connect-timeout=5000
webclient.read-timeout=10000

# Springdoc OpenAPI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
